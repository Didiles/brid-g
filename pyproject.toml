[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridg"
version = "0.1.0"
description = "Plug-and-play BRID-G graph construction from a feature matrix"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Diego" },
]
keywords = [
    "graph-construction",
    "BRID-G",
    "diversity",
    "kNN",
    "GNN",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "networkx>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.17", "mypy>=1.13"]
viz = ["plotly>=5.18"]
classify = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/Didiles/brid-g"
Repository = "https://github.com/Didiles/brid-g"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: N≈1000 graph construction; skip in the default fast suite",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["bridg"]

[tool.mypy]
files = ["bridg"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
    "networkx",
    "networkx.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
