[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridg"
version = "0.1.0"
description = "Plug-and-play BRID-G graph construction from a feature matrix"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Diego" },
]
keywords = [
    "graph-construction",
    "BRID-G",
    "diversity",
    "kNN",
    "GNN",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.0",
    "networkx>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Didiles/brid-g"
Repository = "https://github.com/Didiles/brid-g"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
